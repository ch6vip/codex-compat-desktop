name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # dtolnay/rust-toolchain@stable（固定到快照版本）
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: cargo test
        run: cargo test --locked
        working-directory: src-tauri

  build-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-node@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # 与本地开发一致（package-lock 由 npm 12 / node 24 生成）
          node-version: 24
          cache: npm
      # dtolnay/rust-toolchain@stable（固定到快照版本）
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: cargo test
        run: cargo test --locked
        working-directory: src-tauri
      - name: install frontend deps
        run: npm ci
      - name: build (frontend + tauri bundle)
        run: npx tauri build
      - name: upload to GitHub Release
        # softprops/action-gh-release@v2
        uses: >-
          softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          generate_release_notes: true
          overwrite_files: true
          files: src-tauri/target/release/bundle/nsis/*.exe
