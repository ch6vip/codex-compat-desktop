[package]
name = "codex-compat-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "codex_compat_desktop_lib"
# 桌面端只需 rlib；cdylib 会在 MinGW ld 触发 "export ordinal too large"。
crate-type = ["rlib"]
# 单测全部放在 tests/（集成测试）—— lib 测试二进制吃不到 manifest，
# 会在加载 comctl32 v6 符号时崩 STATUS_ENTRYPOINT_NOT_FOUND。
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["time"] }
